[package]
name = "fossh-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "foSSH admin bridge: a headless JSON-lines-over-stdio front end to the local admin surfaces, spawned as a child process by fossh-console. Never listens on a socket."

[[bin]]
name = "fossh-agent"
path = "src/main.rs"

[features]
default = []
# Off by default, same reason and same shape as fossh-fcgi's own
# `quic` feature (see that crate's Cargo.toml and DECISIONS.md
# ADR-0050 Part 3): fossh-ipc pulls in quiche's own BoringSSL build, a
# genuinely heavy compile step no other member of this workspace
# should pay for on an ordinary `cargo build --workspace`. Without
# this feature, `watchdog_status::query` still compiles and runs — it
# just always returns a "not compiled with watchdog support" error
# rather than ever attempting a connection (see that module).
quic = ["dep:fossh-ipc"]

[dependencies]
fossh-core.workspace = true
fossh-store.workspace = true
fossh-admin.workspace = true
fossh-ipc = { path = "../fossh-ipc", optional = true }
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
nix = { workspace = true, features = ["signal", "process"] }

# Deliberately NOT a dependency here: any HTTP/TLS client crate.
# `integrations_net.rs` shells out to the system `curl` instead, and
# ADR-0063 records why — the short version is that this binary is the
# only place in the project that ever makes an outbound request, the
# request is operator-triggered rather than automatic, and a
# rustls/ring dependency tree would add ~80 crates to the §3.10
# supply-chain gate to do what one already-audited, already-installed
# system tool does. Nothing about that choice is load-bearing for
# security: the API key never reaches `curl`'s argv or environment
# (see that module's own doc comment).
