# cbindgen config — generates include/fossh.h from src/lib.rs.
# Regenerate with: cbindgen --config cbindgen.toml --crate fossh-ffi --output ../../include/fossh.h
language = "C"
header = "/* foSSH C ABI (§11). Generated by cbindgen from crates/fossh-ffi/src/lib.rs — do not edit by hand. */"
autogen_warning = "/* This file is generated by cbindgen. Do not edit it manually; edit crates/fossh-ffi/src/lib.rs and regenerate instead. */"
include_guard = "FOSSH_H"
includes = ["stdint.h", "stddef.h"]
no_includes = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
usize_is_size_t = true

[export]
include = ["fossh_ctx", "FosshError"]

[export.rename]
FosshError = "fossh_err_t"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
prefix = ""
