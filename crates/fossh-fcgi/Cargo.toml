[package]
name = "fossh-fcgi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "foSSH persistent FastCGI listener (M7, feature `fcgi`) and optional loopback/unix-socket-only HTTP listener (feature `http`, off by default, S7-enforced)."

[[bin]]
name = "fossh-fcgi"
path = "src/main.rs"

[features]
default = ["fcgi"]
fcgi = []
http = []

[dependencies]
fossh-core.workspace = true
fossh-store.workspace = true
fossh-ingest.workspace = true
fossh-admin.workspace = true
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
blake3.workspace = true
