name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test, clippy, fmt (both workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: root workspace — test
        # --locked: without it, a committed Cargo.lock that has drifted
        # out of sync with Cargo.toml (a stray hand-edit, a rebase that
        # dropped a lockfile update, ...) is silently repaired by cargo
        # and the run passes — the exact "looks clean, isn't" shape this
        # whole review exists to catch. --locked turns that into a hard
        # failure instead of a silent rewrite.
        run: cargo test --workspace --locked
      - name: root workspace — clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: root workspace — fmt
        run: cargo fmt --all -- --check
      - name: fossh-ffi workspace — test
        working-directory: crates/fossh-ffi
        run: cargo test --locked
      - name: fossh-ffi workspace — clippy
        working-directory: crates/fossh-ffi
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: fossh-ffi workspace — fmt
        working-directory: crates/fossh-ffi
        run: cargo fmt --all -- --check
      - name: "network-denied test run (P-invariant: zero egress from the ingest path)"
        # §17: "Test suite passes with network fully denied." A firewall
        # rule proves this far more than an env var a test could ignore.
        run: |
          sudo iptables -I OUTPUT -m owner --uid-owner "$(id -u)" -p tcp --syn -j REJECT
          cargo test --workspace --offline --locked
          sudo iptables -D OUTPUT -m owner --uid-owner "$(id -u)" -p tcp --syn -j REJECT

  supply-chain:
    # "both workspaces" was stale: this project has 4 independent Cargo
    # workspaces (root, fossh-ffi, fossh-quiche-ffi, fossh-ipc — see the
    # root Cargo.toml's own `exclude` list and each crate's own
    # single-member [workspace] table), each with its own deny.toml.
    # Before this fix, only 2 of the 4 were ever actually checked here —
    # fossh-quiche-ffi (pins the quiche/BoringSSL version the OCaml
    # watchdog's ctypes bindings link against) and fossh-ipc (the
    # core<->watchdog QUIC/mTLS IPC channel itself) had zero CI
    # supply-chain coverage despite both having a real deny.toml,
    # relying entirely on being re-checked by hand each session.
    # Neither needs
    # a full build to check — cargo-audit/cargo-deny only resolve the
    # dependency graph — so there was no build-cost reason for the gap.
    name: cargo audit + cargo deny (all 4 workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check
      - working-directory: crates/fossh-ffi
        run: cargo audit
      - working-directory: crates/fossh-ffi
        run: cargo deny check
      - working-directory: crates/fossh-quiche-ffi
        run: cargo audit
      - working-directory: crates/fossh-quiche-ffi
        run: cargo deny check
      - working-directory: crates/fossh-ipc
        run: cargo audit
      - working-directory: crates/fossh-ipc
        run: cargo deny check

  fuzz-smoke:
    name: cargo-fuzz smoke run (§3.7, all 5 targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: json_body
        run: cargo +nightly fuzz run json_body -- -max_total_time=15
      - name: query_string
        run: cargo +nightly fuzz run query_string -- -max_total_time=15
      - name: forwarded_for
        run: cargo +nightly fuzz run forwarded_for -- -max_total_time=15
      - name: fcgi_framing
        run: cargo +nightly fuzz run fcgi_framing -- -max_total_time=15
      - name: spool_frame
        run: cargo +nightly fuzz run spool_frame -- -max_total_time=15
      - name: confirm no crash artifacts were left behind
        run: |
          if find fuzz/artifacts -type f | grep -q .; then
            echo "FAIL: fuzz/artifacts is non-empty"
            find fuzz/artifacts -type f
            exit 1
          fi

  watchdog:
    # The OCaml half of this project had zero CI coverage before this
    # entry -- every real bug this session found in it (the subprocess
    # pipe-read ordering fix, ADR-0091) was caught by hand, on one
    # machine, not by anything that runs automatically.
    #
    # Deliberately NOT opam (a debate-verify pass caught the first
    # draft of this job using ocaml/setup-ocaml@v3 -- wrong toolchain
    # entirely): the real %build section's own comment states dune
    # resolves ocaml/ocaml-dune/ocaml-ctypes from the *system*
    # findlib, matching packaging/rpm/fossh.spec exactly, not an
    # opam-managed switch. Same reasoning, apt-equivalent packages.
    #
    # libquiche.so.0 is gitignored (watchdog/quic/vendor/.gitignore),
    # not committed -- scripts/build-quiche-ffi.sh produces it and has
    # to run before dune build, the same order %build itself uses.
    name: watchdog (dune test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install system OCaml toolchain + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ocaml dune libctypes-ocaml-dev ocaml-findlib jq gnupg2
      - name: build-quiche-ffi (produces watchdog/quic/vendor/libquiche.so.0)
        run: ./scripts/build-quiche-ffi.sh
      - name: dune build
        working-directory: watchdog
        run: dune build --profile release
      - name: dune test
        working-directory: watchdog
        run: |
          export LD_LIBRARY_PATH="$(pwd)/quic/vendor:$LD_LIBRARY_PATH"
          dune test

  console:
    # The Python/GTK4 console had zero CI coverage before this entry
    # either. gui/tests/screenshot.py -- the one tool that would have
    # caught this session's rotted-harness bug (a stale ConsoleWindow()
    # call, unnoticed because nothing ever ran it) -- needs a real
    # display; xvfb-run provides a virtual one headlessly. The unit
    # suite (gui/tests/*.py, not screenshot.py) needs no display and
    # is the bulk of real coverage (palette/WCAG, branding, advisor
    # logic, app lifecycle ordering -- ADR-0085's own regression test).
    name: console (pytest + a real screenshot render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install GTK4/libadwaita + test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-gtk-4.0 gir1.2-adw-1 python3-gi xvfb
          pip install pytest PyGObject
      - name: pytest (headless, no display needed)
        run: python3 -m pytest gui/tests/ -q --ignore=gui/tests/screenshot.py
      - name: real screenshot render, proves the app actually draws
        run: |
          xvfb-run -a env PYTHONPATH=gui python3 gui/tests/screenshot.py /tmp/ci-shots
          test -f /tmp/ci-shots/overview.png

  packaging:
    # rpmlint against a real built package -- this session found real,
    # actionable findings this way (60e2443's redundant openssl-libs
    # Requires) that a spec-only review would never surface, because
    # rpmlint's most useful checks (non-standard-uid/gid, dangerous
    # scriptlet commands, unpackaged tmpfiles) only exist once there's
    # a real built RPM to inspect.
    name: rpmbuild + rpmlint (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        # Every line here is packaging/rpm/fossh.spec's own real
        # BuildRequires list (23 entries, re-grepped from the spec
        # itself, not retyped from memory -- a debate-verify pass
        # caught the first draft of this job missing 16 of them).
        run: |
          dnf install -y rpm-build rpmlint \
            cargo rust gcc git openssl-devel pkgconfig openssl \
            checkpolicy policycoreutils systemd-rpm-macros \
            selinux-policy selinux-policy-devel \
            gnupg2 cmake clang-devel \
            ocaml ocaml-dune ocaml-ctypes-devel ocaml-findlib jq libffi-devel \
            python3-devel desktop-file-utils libappstream-glib appstream
      - name: build (skips %check here -- covered by the test/watchdog/console jobs above)
        run: sh scripts/build-release-rpm.sh
      - name: rpmlint the real built packages
        run: rpmlint dist/*.rpm

  release-hygiene:
    name: identity-hygiene gate (§19.4.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the git-identity check needs full history, not a shallow clone
      - name: prove the gate itself catches something, before trusting a clean run
        run: ./scripts/test-identity-hygiene-gate.sh
      - name: check this repository
        env:
          # Populate as a repository secret to also check for the real
          # name/email specifically — see scripts/check-identity-hygiene.sh's
          # own header comment for why that's a secret, not a literal
          # pattern committed to this file.
          FOSSH_HYGIENE_EXTRA_PATTERNS: ${{ secrets.FOSSH_HYGIENE_EXTRA_PATTERNS }}
        run: ./scripts/check-identity-hygiene.sh
