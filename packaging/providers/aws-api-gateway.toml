# AWS, in the one shape that can honestly be expressed as a static
# credential.
#
# API Gateway's own API-key mechanism uses a fixed `x-api-key` header,
# which is exactly this model. AWS service APIs proper (S3, CloudWatch,
# SQS) sign every request with SigV4 and cannot be reached this way at
# all -- put an API Gateway or a Lambda function URL in front of them
# and point this at that.
id = "aws-api-gateway"
name = "AWS API Gateway (API key)"
docs = "https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html"
endpoint = "https://{api_id}.execute-api.{region}.amazonaws.com/{stage}"
method = "post"
auth_header = "x-api-key"
key_hint = "a 40-character key from the API Gateway console, not an IAM access key"

[[fields]]
key = "api_id"
label = "API ID"
placeholder = "a1b2c3d4e5"
help = "The REST API's id, shown in the API Gateway console."

[[fields]]
key = "region"
label = "Region"
placeholder = "eu-west-1"

[[fields]]
key = "stage"
label = "Stage"
placeholder = "prod"
