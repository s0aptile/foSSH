# Installed to /usr/lib/tmpfiles.d/fossh.conf by the RPM (§3.11).
# /run is a tmpfs, wiped on every real reboot — systemd-tmpfiles
# recreates these at boot, independent of any single service unit's
# own start/stop lifecycle (unlike a bare `RuntimeDirectory=` on the
# .service, which would delete/recreate this on every service restart,
# not just on reboot — wrong for a directory holding a salt file meant
# to rotate daily, not per-restart).
d /run/fossh 0750 fossh-svc fossh-svc -
d /run/fossh/salt 0750 fossh-svc fossh-svc -
