# Installed to /usr/lib/tmpfiles.d/fossh-selfheal.conf by the selfheal
# subpackage's RPM. Its own runtime directory, deliberately not a
# corner of /run/fossh: that one is the base package's ingest runtime
# (the fcgi and bootstrap sockets, the salt file) and stays
# fossh-svc:fossh-svc so nothing here widens who can reach a socket
# the core ingest path depends on, and so a base-only install (no
# selfheal, no fossh-selfheal group) never has to resolve a group name
# that does not exist yet.
#
# 0770, group fossh-selfheal: fossh-svc always has full access as the
# owner. A human running the console needs group membership instead
# (`sudo usermod -a -G fossh-selfheal $USER`, then log out and back in
# — see docs/SELF-HEALING.md) to create and hold the exclusivity lock
# alongside the scheduled tick, which also runs as fossh-svc. Without
# this, the console falls back to the per-user lock in
# gui/fossh_console/advisor_client.py's LOCK_FALLBACK, which excludes
# nothing the scheduled tick's own lock does, and Hellen's Eye can
# never actually run — see that file's exclusivity_is_shared().
d /run/fossh-selfheal 0770 fossh-svc fossh-selfheal -
