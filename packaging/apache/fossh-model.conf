# foSSH — the local model endpoint, closed.
#
# Ollama serves the optional self-healing advisory model. This file is
# the only thing in front of it, and everything here exists to make one
# statement true: nothing outside this machine can reach it, and
# nothing on this machine can reach it without the per-install secret.
#
# Install as /etc/httpd/conf.d/fossh-model.conf. Requires mod_proxy,
# mod_proxy_http, mod_headers, and mod_authz_core.
#
# --- Why Apache at all, when Ollama already binds loopback ---
#
# Ollama's own bind address stops the network reaching it. It does not
# stop *every local account* reaching it: an unprivileged user on this
# box can connect to 127.0.0.1:11434 and use the model freely, and on
# a shared or multi-tenant host that is a real resource-exhaustion and
# information-disclosure path. Apache in front adds the check Ollama
# has no concept of, using a secret that is 0600 to fossh-svc.
#
# --- The listener ---
#
# Loopback only, on a port distinct from Ollama's own so the two cannot
# be confused in a netstat listing or a firewall rule.
Listen 127.0.0.1:11435

<VirtualHost 127.0.0.1:11435>
    ServerName fossh-model.localhost

    # Belt and braces: even if this vhost were ever bound more widely
    # by a later edit, the authorization below is what actually
    # decides, not the bind address.
    <Location "/">
        # mod_setenvif reads the shared secret from a file Apache can
        # see but other users cannot. `Require expr` compares in
        # constant time is NOT guaranteed here -- Apache's expression
        # engine has no constant-time compare -- which is acceptable
        # for a 256-bit random bearer over loopback, where a timing
        # oracle would need local access it could use more directly.
        # The secret lives in /etc/fossh-model, owned root:apache mode
        # 0640 inside a 0750 root:apache directory, and fossh-svc is
        # added to the apache group by this subpackage's %post so both
        # sides can read the one file.
        #
        # NOT /etc/fossh: fossh-watchdog owns that as 0700
        # fossh-watchdog:fossh-watchdog for the setup token, and Apache
        # cannot traverse into it. With both subpackages installed the
        # lookup below failed for every request, silently.
        #
        # It is written with NO TRAILING NEWLINE, and that is
        # load-bearing rather than tidy: Apache's file() returns the
        # file's bytes verbatim, newline included, so a secret written
        # by `echo` instead would compare as "abc\n" against a header
        # of "abc" and this check would deny every request forever
        # while looking perfectly correct. keylock.rs writes it
        # without one and has a test asserting so.
        #
        # `==` is not a constant-time comparison -- Apache's
        # expression engine has none. Accepted for a 256-bit random
        # bearer reachable only from loopback: an attacker positioned
        # to time this already has local code execution and a shorter
        # path to the same secret.
        # Both operands are checked non-empty BEFORE they are compared,
        # and that is not defensive padding -- without it this check
        # fails OPEN. Apache's expression engine evaluates a missing
        # request header to "" and `file()` on a zero-byte file to "",
        # so `"" == ""` is true and a request presenting NO CREDENTIAL
        # AT ALL is authorised. Reproduced against a real httpd 2.4.68:
        # truncating the secret to zero bytes and sending no header
        # returned 200 and genuinely proxied to the upstream.
        #
        # That is reachable by an ordinary mishap rather than an attack
        # -- a disk-full mid-write, a botched rotation, a file created
        # before its contents are written -- which is what makes it
        # worth three clauses instead of one.
        Require expr "%{HTTP:X-foSSH-Model-Key} != '' && file('/etc/fossh-model/model-access-secret') != '' && %{HTTP:X-foSSH-Model-Key} == file('/etc/fossh-model/model-access-secret')"

        ProxyPass        "http://127.0.0.1:11434/"
        ProxyPassReverse "http://127.0.0.1:11434/"

        # The model endpoint is not a browser surface. No caching, no
        # referrer, nothing embeddable.
        Header always set Cache-Control "no-store"
        Header always set Referrer-Policy "no-referrer"
        Header always set X-Content-Type-Options "nosniff"

        # Two directives, because they act on two different things and
        # only one of them was here originally.
        #
        # `Header` edits the RESPONSE. `RequestHeader` edits the
        # request that gets proxied upstream. The gateway secret was
        # being stripped from responses (correct, but nothing was
        # sending it back anyway) and forwarded to Ollama on every
        # single call -- confirmed by logging what a real upstream
        # received. Ollama has no use for the gateway's credential and
        # no business seeing it.
        Header always unset X-foSSH-Model-Key
        RequestHeader unset X-foSSH-Model-Key
        RequestHeader unset Authorization
    </Location>

    # Generation is slow by nature and a stuck one must not hold a
    # worker forever. Matches GENERATION_TIMEOUT_SECS in advisor.rs;
    # the two are meant to agree, and the Rust side is the one that
    # gives up first so the operator sees its message rather than a
    # bare 504.
    ProxyTimeout 25

    # Worth knowing when reading this log: an unreadable or missing
    # secret file makes every request 500 and writes NOTHING here, even
    # at LogLevel debug -- ap_expr gives no diagnostic for a failed
    # `file()`. Verified against a real httpd. A run of unexplained
    # 500s with an empty error log means "httpd cannot read
    # /etc/fossh-model/model-access-secret", and the fix is its ownership,
    # not this file. It fails closed, which is the right direction.
    # No TLS on this vhost: it listens on loopback only and terminating
    # TLS for a connection that never leaves the machine would add a
    # certificate to manage for no attacker it excludes. If you move
    # this endpoint off loopback -- which this configuration does not
    # support and does not recommend -- TLS becomes mandatory, and the
    # floor is the same one the rest of foSSH uses:
    #
    #     SSLProtocol -all +TLSv1.3 +TLSv1.2
    #
    # 1.3 preferred, 1.2 accepted, everything older refused.
    ErrorLog  "logs/fossh-model_error_log"
    # No CustomLog: request bodies are prompts, and while foSSH's own
    # prompts carry nothing about a visitor (see advisor.rs), an
    # access log of this endpoint is a standing invitation to change
    # that later and not notice.
</VirtualHost>
