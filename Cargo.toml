[workspace]
resolver = "2"
members = [
    "crates/fossh-core",
    "crates/fossh-store",
    "crates/fossh-ingest",
    "crates/fossh-cgi",
    "crates/fossh-fcgi",
    "crates/fossh-cli",
    "crates/fossh-admin",
    "crates/fossh-agent",
    "crates/fossh-selfheal",
]
# Crates join `members` as each milestone lands (M2 adds fossh-store, etc.) — see DECISIONS.md.
# fossh-ffi is deliberately NEVER a member — see DECISIONS.md "FFI crate split".
# fuzz/ is deliberately never a member either: cargo-fuzz needs nightly,
# its own profile.release.debug override, and no panic="abort" — all of
# which would collide with this workspace's shared release profile below.
# fossh-quiche-ffi and fossh-ipc (§3.4) are excluded for a third reason:
# quiche's default TLS backend vendors and compiles BoringSSL from
# source via cmake, a genuinely heavy build step (real, measured: tens
# of seconds even incrementally) no other crate in this workspace has
# any reason to pay for on every plain `cargo build --workspace`.
exclude = ["crates/fossh-ffi", "fuzz", "crates/fossh-quiche-ffi", "crates/fossh-ipc"]

[workspace.package]
version = "0.0.2+rev.2"
edition = "2024"
license = "MIT"
authors = ["$0aptile <https://github.com/s0aptile>"]
repository = "https://github.com/s0aptile/foSSH"
homepage = "https://github.com/s0aptile/foSSH"
rust-version = "1.97"

[workspace.dependencies]
fossh-core = { path = "crates/fossh-core" }
fossh-store = { path = "crates/fossh-store" }
fossh-ingest = { path = "crates/fossh-ingest" }
fossh-admin = { path = "crates/fossh-admin" }
fossh-selfheal = { path = "crates/fossh-selfheal" }
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1.5"
subtle = "2.6"
ed25519-dalek = "3"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
memmap2 = "0.9"
libc = "0.2"
proptest = "1"
nix = "0.29"
sha2 = "0.10"
chacha20poly1305 = "0.10"
maxminddb = "0.30"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
